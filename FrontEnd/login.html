<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Work+Sans&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Page de connexion pour l'architecte d'intérieur Sophie Bluel"
    />
    <link rel="stylesheet" href=".\assets\style.css" />
    <script src=".\assets\login.js" defer></script>
    <title>Page de Connexion</title>
  </head>
  <body>
    <header>
      <h1>Sophie Bluel <span>Architecte d'intérieur</span></h1>
      <nav>
        <ul>
          <li>projets</li>
          <li>contact</li>
          <li>login</li>
          <li><img src="./assets/icons/instagram.png" alt="Instagram" /></li>
        </ul>
      </nav>
    </header>
    <main>
      <div class="login-container">
        <h2>Login</h2>

        <form id="loginForm" method="post">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required placeholder="exemple@domaine.com" />
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" required placeholder="Votre mot de passe"/>
          <button type="submit" value="Login" class="login-button">
            Se connecter
          </button>
        </form>
        <div id="error-message"></div>
        <a class="mdp-oublie" href="#">Mot de passe oublié ?</a>
      </div>
    </main>
  </body>
</html>
